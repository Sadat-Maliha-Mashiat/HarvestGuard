<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestGuard - Weather Integration</title>
  <link rel="stylesheet" crossorigin href="/assets/weather-C25KQUex.css">
</head>

<body>
    <button id="go-home" data-i18n="goHome">Go Back to Home 🏡</button>

    <div class="weather-container">
        <h1 id="weather-heading">Weather Forecast</h1>

        <!-- Language Selector and Upazila Selector in One Line -->
        <div class="selector-container">
            <div class="control-group">
                <label for="language" id="languageLabel">Choose Language:</label>
                <select id="language" onchange="setLanguage()">
                    <option value="en">English</option>
                    <option value="bn" selected>বাংলা</option>
                </select>
            </div>

            <div class="control-group">
                <label for="upazila" id="upazilaLabel">Select Your Upazila:</label>
                <select id="upazila">
                    <option value="Savar">সাভার / Savar</option>
                    <option value="Gazipur">গাজীপুর / Gazipur</option>
                    <option value="Patiya">পটিয়া / Patiya</option>
                    <option value="Satkhira">সাতক্ষীরা / Satkhira</option>
                    <option value="Bogura">বগুড়া / Bogura</option>
                    <option value="Sylhet">সিলেট / Sylhet</option>
                    <option value="Cumilla">কুমিল্লা / Cumilla</option>
                    <option value="Rangpur">রংপুর / Rangpur</option>
                    <option value="Barishal">বরিশাল / Barishal</option>
                    <option value="Mymensingh">ময়মনসিংহ / Mymensingh</option>
                    <option value="Khulna">খুলনা / Khulna</option>
                    <option value="Rajshahi">রাজশাহী / Rajshahi</option>
                    <option value="Brahmanbaria">ব্রাহ্মণবাড়িয়া / Brahmanbaria</option>
                    <option value="Noakhali">নোয়াখালী / Noakhali</option>
                    <option value="Dinajpur">দিনাজপুর / Dinajpur</option>
                    <option value="Jessore">যশোর / Jessore</option>
                    <option value="Tangail">টাঙ্গাইল / Tangail</option>
                    <option value="Kishoreganj">কিশোরগঞ্জ / Kishoreganj</option>
                    <option value="Pabna">পাবনা / Pabna</option>
                    <option value="Kushtia">কুষ্টিয়া / Kushtia</option>
                </select>
            </div>

            <button id="btnGetWeather" onclick="getWeatherData()">Get Weather</button>
            <button id="btnGetLocation" onclick="getWeatherAtLocation()"
                style="background-color: #2196F3; margin-left: 5px;">📍 Use My Location</button>
        </div>

        <!-- Advisory Section (Initially hidden or empty) -->
        <div id="advisory-card" class="advisory-card" style="display: none;">
            <h2 id="advisory-title">Advisory</h2>
            <p id="advisory-text"></p>
        </div>

        <!-- Forecast Grid Section -->
        <div id="forecast-grid" class="forecast-grid">
            <!-- Forecast cards will be injected here by JS -->
        </div>
    </div>

    <script src="weather.js"></script>
</body>

</html>
